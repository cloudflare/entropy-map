[package]
name = "entropy-map"
version = "1.1.0"
edition = "2021"
authors = [
    "Alex Bocharov <bocharov.alexandr@gmail.com>",
    "Austin Hartzheim <inbox@austinhartzheim.me>"
]
description = "Ultra-low latency hash map using minimal perfect hash functions and compact encoding of values, minimizing memory footprint and storage size for efficient data retrieval."
documentation = "https://docs.rs/entropy-map"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/cloudflare/entropy-map"
keywords = ["map", "hashing", "minimal", "perfect", "mphf"]
categories = ["algorithms", "data-structures"]

[dependencies]
bitpacking = "0.9.2"
num = "0.4.1"
rkyv = { version = "0.8", optional = true }
wyhash = "0.6"

[dev-dependencies]
bitvec = "1.0.1"
criterion = { version = "0.7", features = ["html_reports"] }
paste = "1.0.14"
proptest = "1.4.0"
rand = "0.8.5"
rand_chacha = "0.3.1"
rustc-hash = "2"
test-case = "3.3.1"

[features]
default = []
rkyv_derive = ["rkyv"]

[[bench]]
name = "rank"
harness = false

[[bench]]
name = "mphf"
harness = false
required-features = ["rkyv_derive"]

[[bench]]
name = "map"
harness = false
required-features = ["rkyv_derive"]

[[bench]]
name = "map_with_dict"
harness = false
required-features = ["rkyv_derive"]

[[bench]]
name = "map_with_dict_bitpacked"
harness = false
required-features = ["rkyv_derive"]

[[bench]]
name = "set"
harness = false
required-features = ["rkyv_derive"]

# [profile.release]
# codegen-units = 1
# debug = true
# lto = "fat"
# opt-level = 3
